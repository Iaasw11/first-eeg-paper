<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
<style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#173a63}.title{font-size:46px;font-weight:700}.h{font-size:27px;font-weight:700}.b{font-size:21px}.s{font-size:18px}.box{rx:20;ry:20;stroke-width:3}.arr{stroke:#2e7bcf;stroke-width:5;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2e7bcf"/></marker></defs>
<rect width="1800" height="1200" fill="#fff"/><text x="900" y="60" text-anchor="middle" class="title">MI-EEG 可视化 Pipeline（修正版）</text><text x="900" y="100" text-anchor="middle" class="h" fill="#d33e3e">关键更正：Trial 是实验试次；Epoch 是从该 Trial 对应 EEG 中截取的时间窗</text>
<rect x="70" y="130" width="1660" height="110" class="box" fill="#e8f3fd" stroke="#91c6ee"/><text x="105" y="172" class="h">A. 实验结构：Trial 先存在</text><text x="105" y="212" class="b">Experiment → Subject → Trial 1 / Trial 2 / … / Trial N；每个 Trial 是一次完整运动想象任务。</text>
<path d="M900 240 L900 275" class="arr"/>
<rect x="70" y="285" width="1660" height="150" class="box" fill="#e6f7ef" stroke="#8fcdb3"/><text x="105" y="328" class="h">1. 连续 EEG + 事件标记（Event Markers）</text><text x="105" y="365" class="b">设备持续记录所有通道；实验程序同步记录每个 Trial 的关键事件位置（左手 / 右手 / 双脚 / 舌头等）。</text><line x1="210" y1="395" x2="620" y2="395" stroke="#3279c7" stroke-width="3"/><line x1="210" y1="410" x2="620" y2="410" stroke="#e67e22" stroke-width="3"/><line x1="210" y1="425" x2="620" y2="425" stroke="#15956f" stroke-width="3"/><line x1="760" y1="405" x2="1530" y2="405" stroke="#26384a" stroke-width="3"/><text x="900" y="390" class="s" fill="#d33e3e">左手</text><text x="1100" y="390" class="s" fill="#2d67c7">右手</text><text x="1300" y="390" class="s" fill="#2b8a61">双脚</text><text x="1470" y="390" class="s" fill="#d68b00">舌头</text>
<path d="M900 435 L900 470" class="arr"/>
<rect x="70" y="480" width="1660" height="120" class="box" fill="#f1eafa" stroke="#bba9df"/><text x="105" y="525" class="h">2. 基础预处理</text><text x="330" y="525" class="b">Band-pass（带通滤波）</text><text x="650" y="525" class="b">Notch（陷波）</text><text x="900" y="525" class="b">Resample（重采样）</text><text x="1220" y="525" class="b">Artifact（伪迹处理）</text><text x="105" y="568" class="s">具体顺序以数据集和论文方案为准；目标是让信号更适合分析。</text>
<path d="M900 600 L900 635" class="arr"/>
<rect x="70" y="645" width="1660" height="180" class="box" fill="#fff2dc" stroke="#e7b15a"/><text x="105" y="690" class="h">3. 用 Event 定位 Trial → 从该 Trial 对应 EEG 中截取 Epoch</text><text x="105" y="730" class="b" fill="#d33e3e">概念顺序：Trial（一次实验试次）→ 选择时间窗 → Epoch（EEG 片段）</text><line x1="170" y1="780" x2="1000" y2="780" stroke="#24384a" stroke-width="3"/><rect x="410" y="750" width="420" height="60" rx="12" fill="#ffd17a" stroke="#cf7a00" stroke-width="2"/><text x="620" y="788" text-anchor="middle" class="b">Epoch：例如 0.5–4.5 s</text><text x="1110" y="755" class="b">若 fs = 250 Hz，T = 4 s</text><text x="1110" y="800" class="h">N = fs × T = 1000</text>
<path d="M900 825 L900 860" class="arr"/>
<rect x="70" y="870" width="1660" height="125" class="box" fill="#e8f3fd" stroke="#91c6ee"/><text x="105" y="915" class="h">4. 得到一个 EEG Epoch，并把它作为一个机器学习 Sample</text><text x="500" y="965" class="h">一个 Epoch / Sample = [Channel, Time] = [22, 1000]</text><text x="1240" y="952" class="b" fill="#d33e3e">注意：不是“Epoch 形成 Trial”</text>
<path d="M900 995 L900 1030" class="arr"/>
<rect x="70" y="1040" width="1660" height="110" class="box" fill="#e6f7ef" stroke="#8fcdb3"/><text x="105" y="1083" class="h">5. 多个 Epoch / Samples 堆叠成数据集 → 划分 → 标准化 → Batch 训练</text><text x="105" y="1125" class="b">X = [Sample/Trial, Channel, Time]，例如 [288, 22, 1000]；y = [288]。训练时 Batch 可为 [32, 22, 1000]。</text>
<rect x="70" y="1160" width="1660" height="30" rx="12" fill="#fff7e5" stroke="#e6c26e" stroke-width="2"/><text x="900" y="1183" text-anchor="middle" class="s">核心主线：Experiment/Subject/Trial → 连续 EEG + Event → 预处理 → 从 Trial 截 Epoch → Sample → [Sample, Channel, Time] → Batch → 模型输出</text>
</svg>